name: AUREN isolated regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auren-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  risk-math:
    name: Deterministic risk engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline-test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 pandas==3.1.1 numpy==2.4.6
      - name: Compile Python sources
        run: python -m compileall -q api.py app.py engine tests
      - name: Run isolated deterministic regression suite
        run: python -m pytest -q tests
